[project]
name = "dos-emulator"
version = "0.1.0"
description = "An 8086 PC, emulated well enough to be a reference for reimplementing DOS programs"
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-2.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Boran Car", email = "boran.car@gmail.com" }]
keywords = ["dos", "8086", "emulator", "reverse-engineering", "cga", "unicorn"]
dependencies = [
    "unicorn>=2.0",
    "pygame-ce>=2.4",
]

[project.urls]
Homepage = "https://github.com/borancar/dos_emulator"

[project.scripts]
dos-emulator = "dos_emulator.emulator:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dos_emulator"]
